# vim:set ft=tmux:
# Smart pane switching with awareness of vim splits

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" "send-keys C-h"  "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j"  "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k"  "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l"  "select-pane -R"
bind-key -n C-\\ if-shell "$is_vim" "send-keys C-\\" "select-pane -l"
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
bind-key -T copy-mode-vi C-\\ select-pane -l

# remap prefix to Control + a
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# New splits open in current directory
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Use Vim key bindings in copy mode
setw -g mode-keys vi

# Setup 'v' to begin selection as in Vim
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection

# Update default binding of `Enter` to also use copy-pipe
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send-keys -X copy-selection

# No Esc key delay
set -s escape-time 0

# Mouse support - set to on if you want to use the mouse
set -g mouse on

# Set the default terminal mode to 256color mode
# set -g default-terminal "screen-256color"
# set-option -sa terminal-overrides ",*alacritty*:Tc"
# set-option -sa terminal-overrides ',*256col*:Tc'

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# enable activity alerts
setw -g monitor-activity on
set -g visual-activity on

# # Center the window list
# set -g status-justify centre
#
# # Start windows and panes at 1, not 0
# setw -g base-index 1
# setw -g pane-base-index 1
#
# # Highlight current pane
# set-option -g pane-active-border-style bg=blue,fg=default

# Open a new window, prompt for a hostname, and ssh to it
bind-key S command-prompt -p ssh: "new-window -n %1 'ssh %1'"

# List all panes in all windows
bind-key h choose-tree

# Pair program, but don't shrink my window if you're not paying attention!
setw -g aggressive-resize on

# Undercurl
# set -g default-terminal "${TERM}"
# set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
# set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours

if-shell "type 'reattach-to-user-namespace' >/dev/null" "source ~/.tmux-osx.conf"


bind-key R source-file ~/.tmux.conf



# Modal App Shortcuts
bind-key T display-popup -E -w 80% -h 80% -x C -y C "htop"
bind-key B display-popup -E -w 80% -h 80% -x C -y C "btop"
bind-key K display-popup -E -w 80% -h 80% -x C -y C "k9s"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'tmux-plugins/tmux-battery'

if "test ! -d ~/.tmux/plugins/tpm" \
     "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"


if "test ! -d ~/.tmux/plugins/catppuccin" \
     "run 'git clone -b v2.1.3 https://github.com/catppuccin/tmux.git ~/.tmux/plugins/catppuccin/tmux'"

# Configure Catppuccin
set -g @catppuccin_flavour 'mocha'
# set -g @catppuccin_window_status_style "rounded"
# set -g @catppuccin_window_text " #W"
# set -g @catppuccin_window_current_text " #W"
# set -g @catppuccin_window_status_enable "yes"
# set -g @catppuccin_window_status_icon_enable "yes"

set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_pane_border_status "off"

run '~/.tmux/plugins/catppuccin/tmux/catppuccin.tmux'



# Highlight current pane
set-option -g pane-active-border-style "bg=#{@thm_surface_1}","fg=#{@thm_yellow}"


# === STATUS LEFT ===
set -g status-left-length 101
set -g status-left ""

# Current Session:
set -ga status-left "#{?client_prefix,#{#[bg=#{@thm_red},fg=#{@thm_bg},bold]  #S },#{#[bg=#{@thm_bg},fg=#{@thm_green}]  #S }}"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]│"

# Current Pane Command:
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_maroon}] #{pane_current_command}"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none] │ "

# Current Pane Path:
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_blue}]  #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}} "



# === WINDOW STATUS ===
set -g window-status-separator ""

# Center the window list
set -g status-justify absolute-centre

# Start windows and panes at 1, not 0
setw -g base-index 1
setw -g pane-base-index 1


# window look and feel
set -wg automatic-rename on
set -g automatic-rename-format "Window"

set -g window-status-format " #I#{?#{!=:#{window_name},Window},: #W,:  #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}}} "
set -g window-status-style "bg=#{@thm_bg},fg=#{@thm_rosewater}"
set -g window-status-last-style "bg=#{@thm_bg},fg=#{@thm_peach}"
set -g window-status-activity-style "bg=#{@thm_red},fg=#{@thm_bg}"
set -g window-status-bell-style "bg=#{@thm_red},fg=#{@thm_bg},bold"
set -gF window-status-separator "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}]│"

set -g window-status-current-format " #I#{?#{!=:#{window_name},Window},: #W,:  #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}}} "
set -g window-status-current-style "bg=#{@thm_peach},fg=#{@thm_bg},bold"




# === STATUS RIGHT ===
set -g status-right-length 100
set -g status-right ""

# Prefix / Copy / Normal mode indicator
set -ga status-right "#{?client_prefix,#[fg=#{@thm_red} bold]PREFIX,#{?#{==:#{pane_mode},copy-mode},#[fg=#{@thm_yellow} bold]COPY,#[fg=#{@thm_green} bold]NORMAL}}"
set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}, none] │ "

# Zoom indicator:
set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_yellow}]#{?window_zoomed_flag, ZOOM,}"
set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]#{?window_zoomed_flag, │ ,}"

# Battery indicator
set -ga status-right "#{?#{e|>=:10,#{battery_percentage}},#{#[bg=#{@thm_red},fg=#{@thm_bg}]},#{#[bg=#{@thm_bg},fg=#{@thm_pink}]}}#{battery_icon} #{battery_percentage}"
set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}, none] │ "

# Online indicator:
set -g @online_icon "ok"
set -g @offline_icon "nok"
set -ga status-right "#[bg=#{@thm_bg}]#{?#{==:#{online_status},ok},#[fg=#{@thm_mauve}]󰖩 on,#[fg=#{@thm_red},bold]#[reverse]󰖪 off}"
set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}, none] │ "

# Date time:
set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_blue}]󰭦 %Y-%m-%d 󰅐 %H:%M"
set -ga status-right " "



