[tools]
bun = "latest"
cargo-binstall = "latest"
go = "1.24"
node = "24"
python = "latest"
ruby = "latest"
rust = "latest"

# Python Global Packages
"pipx:uv" = "latest"
"pipx:ruff" = "latest"
"pipx:ty" = "latest"
"pipx:pyright" = "latest"
"pipx:python-lsp-server[all]" = "latest"

# Node Global Packages
"npm:bash-language-server" = "latest"
"npm:dockerfile-language-server-nodejs" = "latest"
"npm:svgo" = "latest"
"npm:typescript" = "latest"
"npm:typescript-language-server" = "latest"
"npm:wscat" = "latest"

# Cargo Global Packages
"cargo:cargo-sweep" = "latest"
"cargo:starship" = "latest"
"cargo:taplo-cli" = "latest"
"cargo:unison-fsmonitor" = "latest"
"cargo:wasm-pack" = "latest"

# hhhhhh:
"npm:@openai/codex" = "latest"

"pipx:llm" = "latest"
"pipx:esptool" = "latest"
"npm:any-json" = "latest"

[settings]
idiomatic_version_file_enable_tools = ["ruby", "python", "node"]

[settings.python]
uv_venv_auto = "create|source"

[settings.npm]
package_manager = "bun"

[settings.pipx]
uvx = true

[bootstrap.packages]
"brew:mas" = "latest"
"brew:rcm" = "latest"

[bootstrap.repos]
"~/.dotfiles" = { url = "https://github.com/ajjahn/dotfiles.git" }

[bootstrap.brew.taps]
"thoughtbot/formulae" = "https://github.com/thoughtbot/homebrew-formulae.git"

[bootstrap.hooks.post-repos]
run = [
  "rcup",
  "brew update",
  "brew bundle --file=~/.Brewfile --jobs auto",
]
